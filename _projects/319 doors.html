<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>319 doors — House 319 Door Challenge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#09090b',
                        card: '#121216',
                        border: '#27272a',
                        primary: {
                            DEFAULT: '#facc15', // Lando / Quadrant yellow
                            hover: '#eab308',
                        },
                        accent: '#22c55e',
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: 'Space Grotesk', sans-serif;
        }
        .glow-yellow {
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.15);
        }
        .glow-yellow-lg {
            box-shadow: 0 0 45px rgba(250, 204, 21, 0.3);
        }
        .glass-panel {
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-background text-zinc-100 min-h-screen selection:bg-primary selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = "https://rcehrefdlvgwetdqyhdce.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjZWhyZWZkbHZnd2VmZHF5aGNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjM5NzMsImV4cCI6MjEwODc5OTk3M30.Br0SmeYBatsm_W-UXm49v4kV4A6EhFNcVju9lRNTWKM";

        let supabase = null;
        const initSupabase = (url, key) => {
            try {
                if (url && key && window.supabase) {
                    supabase = window.supabase.createClient(url, key);
                    return true;
                }
            } catch (e) {
                console.error("Supabase init error:", e);
            }
            return false;
        };

        const DEFAULT_PROFILES = [
            { id: 'demo-1', name: 'Alex Rivera', avatar_url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', created_at: new Date().toISOString() },
            { id: 'demo-2', name: 'Sarah Connor', avatar_url: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150', created_at: new Date().toISOString() },
            { id: 'demo-3', name: 'David 319', avatar_url: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150', created_at: new Date().toISOString() }
        ];

        const DEFAULT_ATTEMPTS = [
            { id: 'att-1', profile_id: 'demo-1', time_ms: 3310, notes: 'Standard speedrun attempt', created_at: new Date().toISOString(), profiles: { name: 'Alex Rivera', avatar_url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150' } },
            { id: 'att-2', profile_id: 'demo-2', time_ms: 4180, notes: 'Stumbled on the upstairs hallway rug.', created_at: new Date(Date.now() - 3600000 * 24).toISOString(), profiles: { name: 'Sarah Connor', avatar_url: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150' } },
            { id: 'att-3', profile_id: 'demo-3', time_ms: 48900, notes: 'God tier routing. Zero door bounce.', created_at: new Date(Date.now() - 3600000 * 48).toISOString(), profiles: { name: 'David 319', avatar_url: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150' } }
        ];

        function App() {
            const [activeTab, setActiveTab] = React.useState('timer'); // timer, leaderboard, profiles
            const [isDemoMode, setIsDemoMode] = React.useState(false);
            const [isInitialized, setIsInitialized] = React.useState(false);
            const [profiles, setProfiles] = React.useState([]);
            const [activeProfile, setActiveProfile] = React.useState(null);
            const [attempts, setAttempts] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [errorMsg, setErrorMsg] = React.useState(null);

            // Timer state
            const [timerState, setTimerState] = React.useState('idle'); // idle, running, stopped
            const [elapsedMs, setElapsedMs] = React.useState(0);
            const [attemptNotes, setAttemptNotes] = React.useState('');
            const [showSaveModal, setShowSaveModal] = React.useState(false);
            const [lastSavedAttempt, setLastSavedAttempt] = React.useState(null);
            const timerRef = React.useRef(null);

            // Profile creation modal
            const [showProfileModal, setShowProfileModal] = React.useState(false);
            const [newProfileName, setNewProfileName] = React.useState('');
            const [newProfileEmoji, setNewProfileEmoji] = React.useState('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150');

            // Delete attempt verification modal (PIN 134)
            const [showDeleteModal, setShowDeleteModal] = React.useState(false);
            const [attemptToDelete, setAttemptToDelete] = React.useState(null);
            const [deletePinInput, setDeletePinInput] = React.useState('');
            const [deleteErrorMsg, setDeleteErrorMsg] = React.useState('');

            // Account deletion modal (PIN 134)
            const [showAccountDeleteModal, setShowAccountDeleteModal] = React.useState(false);
            const [accountPinInput, setAccountPinInput] = React.useState('');
            const [accountDeleteErrorMsg, setAccountDeleteErrorMsg] = React.useState('');

            // Leaderboard filter
            const [leaderboardFilter, setLeaderboardFilter] = React.useState('all'); // all, personal

            // Camera modal state
            const [showCameraModal, setShowCameraModal] = React.useState(false);
            const videoRef = React.useRef(null);
            const canvasRef = React.useRef(null);

            React.useEffect(() => {
                const success = initSupabase(SUPABASE_URL, SUPABASE_ANON_KEY);
                if (success) {
                    loadDataFromSupabase();
                } else {
                    setIsDemoMode(true);
                    setProfiles(DEFAULT_PROFILES);
                    setActiveProfile(DEFAULT_PROFILES[0]);
                    setAttempts(DEFAULT_ATTEMPTS);
                    setLoading(false);
                }
                setIsInitialized(true);
            }, []);

            const loadDataFromSupabase = async () => {
                setLoading(true);
                setErrorMsg(null);
                try {
                    const { data: profData, error: profErr } = await supabase.from('profiles').select('*').order('created_at', { ascending: true });
                    if (profErr) throw profErr;

                    const { data: attData, error: attErr } = await supabase
                        .from('attempts')
                        .select('id, profile_id, time_ms, notes, created_at, profiles(name, avatar_url)')
                        .order('time_ms', { ascending: true });
                    if (attErr) throw attErr;

                    setProfiles(profData || []);
                    if (profData && profData.length > 0) {
                        setActiveProfile(profData[0]);
                    }
                    setAttempts(attData || []);
                } catch (err) {
                    console.error("Supabase load error:", err);
                    setErrorMsg("Failed to connect to Supabase. Switched to local demo mode.");
                    setIsDemoMode(true);
                    setProfiles(DEFAULT_PROFILES);
                    setActiveProfile(DEFAULT_PROFILES[0]);
                    setAttempts(DEFAULT_ATTEMPTS);
                } finally {
                    setLoading(false);
                }
            };

            // TIMER LOGIC
            const updateTimer = () => {
                if (timerRef.current !== null) {
                    const now = performance.now();
                    setElapsedMs(Math.floor(now - timerRef.current));
                }
            };

            const startTimer = () => {
                if (!activeProfile) {
                    setShowProfileModal(true);
                    return;
                }
                setElapsedMs(0);
                setTimerState('running');
                timerRef.current = performance.now();
                const loop = () => {
                    updateTimer();
                    if (timerRef.current !== null) {
                        requestAnimationFrame(loop);
                    }
                };
                requestAnimationFrame(loop);
            };

            const stopTimer = () => {
                if (timerRef.current !== null) {
                    timerRef.current = null;
                }
                setTimerState('stopped');
                setShowSaveModal(true);
                setAttemptNotes('Standard speedrun attempt');
            };

            const saveAttempt = async () => {
                if (!activeProfile) return;
                const newTimeMs = elapsedMs;
                const newNotes = attemptNotes || 'Standard speedrun attempt';
                const newCreatedAt = new Date().toISOString();

                // PERSONAL BESTS ONLY RULE: Check if this profile already has an attempt
                const existingUserAttempt = attempts.find(a => a.profile_id === activeProfile.id);

                if (isDemoMode) {
                    let updatedAttempts = [...attempts];
                    if (existingUserAttempt) {
                        if (newTimeMs < existingUserAttempt.time_ms) {
                            updatedAttempts = updatedAttempts.map(a => a.profile_id === activeProfile.id ? { ...a, time_ms: newTimeMs, notes: newNotes, created_at: newCreatedAt } : a);
                        }
                    } else {
                        const fullAttempt = {
                            id: 'demo-' + Date.now(),
                            profile_id: activeProfile.id,
                            time_ms: newTimeMs,
                            notes: newNotes,
                            created_at: newCreatedAt,
                            profiles: { name: activeProfile.name, avatar_url: activeProfile.avatar_url }
                        };
                        updatedAttempts.push(fullAttempt);
                    }
                    updatedAttempts.sort((a, b) => a.time_ms - b.time_ms);
                    setAttempts(updatedAttempts);

                    const isNewBest = !existingUserAttempt || newTimeMs < existingUserAttempt.time_ms;
                    const isHouseRecord = updatedAttempts.length > 0 && (updatedAttempts[0].profile_id === activeProfile.id);

                    setLastSavedAttempt({ time_ms: newTimeMs, isHouseRecord, isPersonalBest: isNewBest });
                    setShowSaveModal(false);
                    setTimerState('idle');
                    setActiveTab('leaderboard');

                    if (isHouseRecord || isNewBest) {
                        confetti({ particleCount: 120, spread: 90, origin: { y: 0.6 }, colors: ['#facc15', '#eab308', '#ffffff', '#22c55e'] });
                    }
                    return;
                }

                try {
                    if (existingUserAttempt) {
                        if (newTimeMs < existingUserAttempt.time_ms) {
                            await supabase.from('attempts').delete().eq('profile_id', activeProfile.id);
                            const { error } = await supabase.from('attempts').insert([{
                                profile_id: activeProfile.id,
                                time_ms: newTimeMs,
                                notes: newNotes
                            }]);
                            if (error) throw error;
                        }
                    } else {
                        const { error } = await supabase.from('attempts').insert([{
                            profile_id: activeProfile.id,
                            time_ms: newTimeMs,
                            notes: newNotes
                        }]);
                        if (error) throw error;
                    }

                    await loadDataFromSupabase();
                    setShowSaveModal(false);
                    setTimerState('idle');
                    setActiveTab('leaderboard');
                    confetti({ particleCount: 120, spread: 90, origin: { y: 0.6 }, colors: ['#facc15', '#eab308', '#ffffff', '#22c55e'] });
                } catch (err) {
                    console.error("Error saving attempt:", err);
                    alert("Failed to save attempt to Supabase.");
                }
            };

            // DELETE ATTEMPT WITH PIN 134
            const requestDeleteAttempt = (attempt) => {
                setAttemptToDelete(attempt);
                setDeletePinInput('');
                setDeleteErrorMsg('');
                setShowDeleteModal(true);
            };

            const confirmDeleteAttempt = async () => {
                if (deletePinInput !== '134') {
                    setDeleteErrorMsg('Incorrect PIN. Required PIN is 134.');
                    return;
                }
                if (!attemptToDelete) return;

                if (isDemoMode) {
                    setAttempts(attempts.filter(a => a.id !== attemptToDelete.id));
                    setShowDeleteModal(false);
                    setAttemptToDelete(null);
                    return;
                }

                try {
                    const { error } = await supabase.from('attempts').delete().eq('id', attemptToDelete.id);
                    if (error) throw error;
                    setAttempts(attempts.filter(a => a.id !== attemptToDelete.id));
                    setShowDeleteModal(false);
                    setAttemptToDelete(null);
                } catch (err) {
                    console.error("Error deleting attempt:", err);
                    alert("Failed to delete attempt.");
                }
            };

            // CREATE PROFILE
            const handleCreateProfile = async (e) => {
                e.preventDefault();
                if (!newProfileName.trim()) return;

                if (isDemoMode) {
                    const newProf = {
                        id: 'prof-' + Date.now(),
                        name: newProfileName.trim(),
                        avatar_url: newProfileEmoji,
                        created_at: new Date().toISOString()
                    };
                    setProfiles([...profiles, newProf]);
                    setActiveProfile(newProf);
                    setNewProfileName('');
                    setShowProfileModal(false);
                    return;
                }

                try {
                    const { data, error } = await supabase.from('profiles').insert([{
                        name: newProfileName.trim(),
                        avatar_url: newProfileEmoji
                    }]).select('*').single();

                    if (error) throw error;
                    setProfiles([...profiles, data]);
                    setActiveProfile(data);
                    setNewProfileName('');
                    setShowProfileModal(false);
                } catch (err) {
                    console.error("Error creating profile:", err);
                    alert("Failed to create profile.");
                }
            };

            // UPDATE PROFILE PICTURE
            const handleUpdateAvatar = async (newUrl) => {
                setNewProfileEmoji(newUrl);
                if (!activeProfile) return;

                const updated = { ...activeProfile, avatar_url: newUrl };
                setActiveProfile(updated);
                setProfiles(profiles.map(p => p.id === activeProfile.id ? updated : p));

                if (!isDemoMode) {
                    try {
                        await supabase.from('profiles').update({ avatar_url: newUrl }).eq('id', activeProfile.id);
                    } catch (err) {
                        console.error("Error updating avatar in Supabase:", err);
                    }
                }
            };

            // DELETE ACCOUNT WITH PIN 134
            const confirmDeleteAccount = async () => {
                if (accountPinInput !== '134') {
                    setAccountDeleteErrorMsg('Incorrect PIN. Required PIN is 134.');
                    return;
                }
                if (!activeProfile) return;

                if (isDemoMode) {
                    const remainingProfiles = profiles.filter(p => p.id !== activeProfile.id);
                    setProfiles(remainingProfiles);
                    setActiveProfile(remainingProfiles.length > 0 ? remainingProfiles[0] : null);
                    setAttempts(attempts.filter(a => a.profile_id !== activeProfile.id));
                    setShowAccountDeleteModal(false);
                    setAccountPinInput('');
                    return;
                }

                try {
                    await supabase.from('attempts').delete().eq('profile_id', activeProfile.id);
                    const { error } = await supabase.from('profiles').delete().eq('id', activeProfile.id);
                    if (error) throw error;

                    const remainingProfiles = profiles.filter(p => p.id !== activeProfile.id);
                    setProfiles(remainingProfiles);
                    setActiveProfile(remainingProfiles.length > 0 ? remainingProfiles[0] : null);
                    setAttempts(attempts.filter(a => a.profile_id !== activeProfile.id));
                    setShowAccountDeleteModal(false);
                    setAccountPinInput('');
                } catch (err) {
                    console.error("Error deleting account:", err);
                    alert("Failed to delete account.");
                }
            };

            // CAMERA CAPTURE FUNCTIONS
            const startCamera = async () => {
                setShowCameraModal(true);
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                } catch (err) {
                    console.error("Camera access error:", err);
                    alert("Unable to access camera. Please upload an image file instead.");
                    setShowCameraModal(false);
                }
            };

            const capturePhoto = () => {
                if (videoRef.current && canvasRef.current) {
                    const video = videoRef.current;
                    const canvas = canvasRef.current;
                    canvas.width = video.videoWidth || 300;
                    canvas.height = video.videoHeight || 300;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/png');
                    handleUpdateAvatar(dataUrl);
                    stopCameraStream();
                    setShowCameraModal(false);
                }
            };

            const stopCameraStream = () => {
                if (videoRef.current && videoRef.current.srcObject) {
                    const stream = videoRef.current.srcObject;
                    stream.getTracks().forEach(track => track.stop());
                    videoRef.current.srcObject = null;
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        handleUpdateAvatar(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const formatTime = (ms) => {
                const minutes = Math.floor(ms / 60000);
                const seconds = Math.floor((ms % 60000) / 1000);
                const centiseconds = Math.floor((ms % 1000) / 10);
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
            };

            if (!isInitialized) {
                return (
                    <div className="flex items-center justify-center min-h-screen bg-background text-primary">
                        <div className="animate-pulse font-mono tracking-widest text-lg">INITIALIZING TELEMETRY...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-background text-zinc-100 flex flex-col selection:bg-primary selection:text-black">
                    {/* TOP HEADER WITH PROFILE SWITCHER AND + PILOT BUTTON */}
                    <header className="border-b border-border bg-card/60 backdrop-blur-md sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="bg-primary text-black font-extrabold px-2.5 py-1 text-xs tracking-wider rounded uppercase">
                                319 HUD
                            </div>
                            <span className="font-bold tracking-tight text-lg text-white flex items-center gap-2">
                                HOUSE <span className="text-primary">319</span>
                            </span>
                        </div>

                        {/* PROFILE SWITCHER & + PILOT BUTTON */}
                        <div className="flex items-center space-x-3">
                            {profiles.length > 0 && activeProfile && (
                                <div className="relative">
                                    <select
                                        value={activeProfile.id}
                                        onChange={(e) => {
                                            const found = profiles.find(p => p.id === e.target.value);
                                            if (found) setActiveProfile(found);
                                        }}
                                        className="bg-zinc-900 border border-zinc-700 text-white text-sm rounded-lg px-3 py-1.5 pr-8 appearance-none focus:outline-none focus:border-primary cursor-pointer font-medium"
                                    >
                                        {profiles.map(p => (
                                            <option key={p.id} value={p.id}>
                                                👤 {p.name}
                                            </option>
                                        ))}
                                    </select>
                                    <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-zinc-400">
                                        ▼
                                    </div>
                                </div>
                            )}
                            <button
                                onClick={() => {
                                    setNewProfileName('');
                                    setNewProfileEmoji('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150');
                                    setShowProfileModal(true);
                                }}
                                className="bg-primary hover:bg-primary-hover text-black font-bold px-3 py-1.5 text-xs rounded-lg transition-all flex items-center gap-1 shadow-md"
                            >
                                + PILOT
                            </button>
                        </div>
                    </header>

                    {/* NAVIGATION TABS */}
                    <div className="max-w-xl mx-auto w-full px-4 pt-4">
                        <div className="grid grid-cols-3 gap-2 bg-card p-1.5 rounded-xl border border-border">
                            <button
                                onClick={() => setActiveTab('timer')}
                                className={`py-2.5 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${
                                    activeTab === 'timer'
                                        ? 'bg-primary text-black shadow-lg glow-yellow'
                                        : 'text-zinc-400 hover:text-white hover:bg-zinc-800/50'
                                }`}
                            >
                                TIME ATTACK
                            </button>
                            <button
                                onClick={() => setActiveTab('leaderboard')}
                                className={`py-2.5 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${
                                    activeTab === 'leaderboard'
                                        ? 'bg-primary text-black shadow-lg glow-yellow'
                                        : 'text-zinc-400 hover:text-white hover:bg-zinc-800/50'
                                }`}
                            >
                                LEADERBOARD
                            </button>
                            <button
                                onClick={() => setActiveTab('profiles')}
                                className={`py-2.5 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${
                                    activeTab === 'profiles'
                                        ? 'bg-primary text-black shadow-lg glow-yellow'
                                        : 'text-zinc-400 hover:text-white hover:bg-zinc-800/50'
                                }`}
                            >
                                PILOT SETUP
                            </button>
                        </div>
                    </div>

                    {/* MAIN CONTENT AREA */}
                    <main className="max-w-xl mx-auto w-full p-4 flex-1 flex flex-col justify-center">
                        {errorMsg && (
                            <div className="mb-4 bg-red-950/40 border border-red-500/30 text-red-400 text-xs p-3 rounded-lg text-center font-mono">
                                {errorMsg}
                            </div>
                        )}

                        {/* TAB 1: TIME ATTACK */}
                        {activeTab === 'timer' && (
                            <div className="flex flex-col items-center justify-center py-6">
                                {activeProfile ? (
                                    <div className="flex items-center gap-3 mb-6 bg-card px-4 py-2 rounded-full border border-zinc-800">
                                        <img src={activeProfile.avatar_url} alt="" className="w-8 h-8 rounded-full object-cover border border-primary" />
                                        <div className="text-sm font-bold">PILOT: <span className="text-primary font-mono">{activeProfile.name}</span></div>
                                    </div>
                                ) : (
                                    <div className="mb-6 bg-amber-950/40 border border-amber-500/30 text-amber-300 text-xs px-4 py-2 rounded-lg">
                                        Please select or create a pilot profile first!
                                    </div>
                                )}

                                <div className="w-full glass-panel rounded-3xl p-8 flex flex-col items-center justify-center relative overflow-hidden glow-yellow-lg border-zinc-800">
                                    <div className="absolute top-4 left-4 flex items-center gap-1.5 text-xs font-mono text-zinc-500">
                                        <span className="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                                        319 DOOR SPEEDRUN v2.4
                                    </div>

                                    {/* TIMER DISPLAY */}
                                    <div className="my-10 text-center">
                                        <div className="font-mono text-6xl sm:text-7xl font-bold tracking-tighter text-white drop-shadow-md">
                                            {formatTime(elapsedMs)}
                                        </div>
                                        <div className="text-xs uppercase tracking-widest text-zinc-500 mt-2 font-mono">
                                            {timerState === 'running' ? 'CHRONO ACTIVE — SPRINTING' : timerState === 'stopped' ? 'ATTEMPT RECORDED' : 'READY FOR LAUNCH'}
                                        </div>
                                    </div>

                                    {/* START / STOP INTERACTION BUTTON */}
                                    {timerState === 'idle' || timerState === 'stopped' ? (
                                        <button
                                            onClick={startTimer}
                                            className="w-full py-6 bg-primary hover:bg-primary-hover text-black font-extrabold text-xl rounded-2xl transition-all shadow-xl active:scale-95 tracking-wider uppercase flex items-center justify-center gap-2"
                                        >
                                            ⚡ INITIALIZE RUN
                                        </button>
                                    ) : (
                                        <button
                                            onClick={stopTimer}
                                            className="w-full py-6 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xl rounded-2xl transition-all shadow-2xl active:scale-95 tracking-wider uppercase animate-pulse flex items-center justify-center gap-2"
                                        >
                                            🛑 TAP TO STOP CLOCK
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: LEADERBOARD */}
                        {activeTab === 'leaderboard' && (
                            <div className="py-2">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                                        🏆 HOUSE <span className="text-primary">LEADERBOARD</span>
                                    </h2>
                                    <div className="flex bg-card p-1 rounded-lg border border-border">
                                        <button
                                            onClick={() => setLeaderboardFilter('all')}
                                            className={`px-3 py-1 text-xs font-bold rounded-md transition-all ${leaderboardFilter === 'all' ? 'bg-primary text-black' : 'text-zinc-400'}`}
                                        >
                                            GLOBAL
                                        </button>
                                        <button
                                            onClick={() => setLeaderboardFilter('personal')}
                                            className={`px-3 py-1 text-xs font-bold rounded-md transition-all ${leaderboardFilter === 'personal' ? 'bg-primary text-black' : 'text-zinc-400'}`}
                                        >
                                            MY BEST
                                        </button>
                                    </div>
                                </div>

                                {attempts.length === 0 ? (
                                    <div className="text-center py-16 bg-card/50 rounded-2xl border border-border">
                                        <div className="text-3xl mb-2">🏁</div>
                                        <div className="text-zinc-400 font-medium text-sm">No telemetry runs recorded yet.</div>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {attempts
                                            .filter(att => leaderboardFilter === 'all' || (activeProfile && att.profile_id === activeProfile.id))
                                            .map((att, idx) => {
                                                const isChampion = idx === 0 && leaderboardFilter === 'all';
                                                return (
                                                    <div
                                                        key={att.id}
                                                        className={`p-4 rounded-xl border flex items-center justify-between transition-all ${
                                                            isChampion
                                                                ? 'bg-card border-primary/50 glow-yellow'
                                                                : 'bg-card/70 border-zinc-800 hover:border-zinc-700'
                                                        }`}
                                                    >
                                                        <div className="flex items-center space-x-3">
                                                            <div className={`w-7 h-7 rounded-lg flex items-center justify-center font-mono font-bold text-xs ${isChampion ? 'bg-primary text-black' : 'bg-zinc-800 text-zinc-400'}`}>
                                                                #{idx + 1}
                                                            </div>
                                                            <img
                                                                src={att.profiles?.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}
                                                                alt=""
                                                                className="w-10 h-10 rounded-full object-cover border border-zinc-700"
                                                            />
                                                            <div>
                                                                <div className="font-bold text-sm text-white flex items-center gap-2">
                                                                    {att.profiles?.name || 'Unknown Pilot'}
                                                                    {isChampion && (
                                                                        <span className="bg-primary/20 text-primary border border-primary/30 text-[10px] px-2 py-0.5 rounded uppercase font-extrabold tracking-wider">
                                                                            HOUSE CHAMPION
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                <div className="text-xs text-zinc-400 italic mt-0.5">"{att.notes || 'Standard speedrun'}"</div>
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center space-x-4">
                                                            <div className="text-right">
                                                                <div className="font-mono font-bold text-lg text-white">
                                                                    {formatTime(att.time_ms)}
                                                                </div>
                                                                <div className="text-[10px] text-zinc-500 font-mono">
                                                                    {new Date(att.created_at).toLocaleDateString()}
                                                                </div>
                                                            </div>
                                                            {activeProfile && att.profile_id === activeProfile.id && (
                                                                <button
                                                                    onClick={() => requestDeleteAttempt(att)}
                                                                    className="text-zinc-500 hover:text-red-400 p-2 transition-colors rounded-lg hover:bg-red-950/30"
                                                                    title="Delete Run (PIN: 134)"
                                                                >
                                                                    🗑️
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 3: PILOT PROFILE & SETTINGS */}
                        {activeTab === 'profiles' && (
                            <div className="py-2">
                                <h2 className="text-lg font-bold tracking-tight text-white mb-4 flex items-center gap-2">
                                    👤 PILOT <span className="text-primary">CONFIGURATION</span>
                                </h2>

                                {activeProfile ? (
                                    <div className="bg-card border border-zinc-800 rounded-2xl p-6 shadow-xl">
                                        <div className="flex flex-col items-center text-center">
                                            <div className="relative group mb-4">
                                                <img
                                                    src={activeProfile.avatar_url}
                                                    alt=""
                                                    className="w-24 h-24 rounded-full object-cover border-2 border-primary shadow-lg"
                                                />
                                            </div>
                                            <h3 className="text-xl font-bold text-white">{activeProfile.name}</h3>
                                            <p className="text-xs text-zinc-400 font-mono mt-1">ID: {activeProfile.id}</p>
                                        </div>

                                        <div className="mt-6 border-t border-zinc-800 pt-6">
                                            <h4 className="text-xs font-bold tracking-wider text-zinc-400 uppercase mb-3">Change Profile Picture</h4>
                                            <div className="flex gap-2 mb-4">
                                                <button
                                                    onClick={startCamera}
                                                    className="flex-1 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-xs rounded-xl transition-all border border-zinc-700"
                                                >
                                                    📷 Take Photo
                                                </button>
                                                <label className="flex-1 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-xs rounded-xl transition-all border border-zinc-700 text-center cursor-pointer flex items-center justify-center">
                                                    📁 Upload File
                                                    <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                                                </label>
                                            </div>

                                            <div className="mb-4">
                                                <label className="text-[10px] text-zinc-500 uppercase tracking-wider block mb-1 font-mono">Or Avatar Image URL</label>
                                                <input
                                                    type="text"
                                                    value={newProfileEmoji}
                                                    onChange={(e) => handleUpdateAvatar(e.target.value)}
                                                    className="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-primary font-mono"
                                                />
                                            </div>
                                        </div>

                                        <div className="mt-6 border-t border-zinc-800 pt-6 flex justify-between items-center">
                                            <div>
                                                <div className="text-xs font-bold text-red-400">Danger Zone</div>
                                                <div className="text-[11px] text-zinc-500">Permanently delete this account and all runs (PIN: 134)</div>
                                            </div>
                                            <button
                                                onClick={() => {
                                                    setAccountPinInput('');
                                                    setAccountDeleteErrorMsg('');
                                                    setShowAccountDeleteModal(true);
                                                }}
                                                className="bg-red-950/50 hover:bg-red-900/60 text-red-400 border border-red-500/30 font-bold text-xs px-4 py-2 rounded-xl transition-all"
                                            >
                                                Delete Account
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center py-12 bg-card rounded-2xl border border-zinc-800">
                                        <p className="text-zinc-400 text-sm mb-4">No active pilot selected.</p>
                                        <button
                                            onClick={() => setShowProfileModal(true)}
                                            className="bg-primary text-black font-bold text-xs px-4 py-2 rounded-lg"
                                        >
                                            Create Pilot Profile
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* MODAL: SAVE ATTEMPT */}
                    {showSaveModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                            <div className="bg-card border border-zinc-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl">
                                <h3 className="text-lg font-bold text-white mb-1">RUN COMPLETED!</h3>
                                <p className="text-xs text-zinc-400 mb-4">Final Time: <span className="font-mono font-bold text-primary text-lg">{formatTime(elapsedMs)}</span></p>
                                
                                <label className="text-xs text-zinc-400 font-mono block mb-1">Add Run Notes (Optional):</label>
                                <input
                                    type="text"
                                    value={attemptNotes}
                                    onChange={(e) => setAttemptNotes(e.target.value)}
                                    placeholder="e.g. Clean run, no slips"
                                    className="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white mb-6 focus:outline-none focus:border-primary"
                                />

                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setShowSaveModal(false)}
                                        className="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-xs rounded-xl transition-all"
                                    >
                                        Discard
                                    </button>
                                    <button
                                        onClick={saveAttempt}
                                        className="flex-1 py-3 bg-primary hover:bg-primary-hover text-black font-bold text-xs rounded-xl transition-all"
                                    >
                                        Save Best Run
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CREATE PILOT */}
                    {showProfileModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                            <div className="bg-card border border-zinc-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl">
                                <h3 className="text-lg font-bold text-white mb-1">CREATE NEW PILOT</h3>
                                <p className="text-xs text-zinc-400 mb-4">Enter runner name & avatar.</p>

                                <form onSubmit={handleCreateProfile}>
                                    <label className="text-xs text-zinc-400 font-mono block mb-1">Pilot Name:</label>
                                    <input
                                        type="text"
                                        value={newProfileName}
                                        onChange={(e) => setNewProfileName(e.target.value)}
                                        placeholder="e.g. Max Verstappen"
                                        required
                                        className="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white mb-4 focus:outline-none focus:border-primary"
                                    />

                                    <label className="text-xs text-zinc-400 font-mono block mb-1">Avatar Image URL:</label>
                                    <input
                                        type="text"
                                        value={newProfileEmoji}
                                        onChange={(e) => setNewProfileEmoji(e.target.value)}
                                        className="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white mb-6 focus:outline-none focus:border-primary font-mono text-xs"
                                    />

                                    <div className="flex gap-3">
                                        <button
                                            type="button"
                                            onClick={() => setShowProfileModal(false)}
                                            className="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-xs rounded-xl transition-all"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 py-3 bg-primary hover:bg-primary-hover text-black font-bold text-xs rounded-xl transition-all"
                                        >
                                            Create Pilot
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: DELETE ATTEMPT PIN (134) */}
                    {showDeleteModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                            <div className="bg-card border border-zinc-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl">
                                <h3 className="text-lg font-bold text-white mb-1">AUTHORIZE DELETION</h3>
                                <p className="text-xs text-zinc-400 mb-4">Enter security PIN <span className="text-primary font-mono font-bold">134</span> to delete this run.</p>

                                <input
                                    type="password"
                                    maxLength="3"
                                    value={deletePinInput}
                                    onChange={(e) => setDeletePinInput(e.target.value)}
                                    placeholder="Enter PIN"
                                    className="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2.5 text-center text-lg text-white mb-2 font-mono tracking-widest focus:outline-none focus:border-primary"
                                />
                                {deleteErrorMsg && <div className="text-xs text-red-400 mb-4 text-center font-mono">{deleteErrorMsg}</div>}

                                <div className="flex gap-3 mt-4">
                                    <button
                                        onClick={() => setShowDeleteModal(false)}
                                        className="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-xs rounded-xl transition-all"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={confirmDeleteAttempt}
                                        className="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl transition-all"
                                    >
                                        Delete Run
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: DELETE ACCOUNT PIN (134) */}
                    {showAccountDeleteModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                            <div className="bg-card border border-zinc-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl">
                                <h3 className="text-lg font-bold text-red-400 mb-1">DELETE ACCOUNT</h3>
                                <p className="text-xs text-zinc-400 mb-4">Enter security PIN <span className="text-primary font-mono font-bold">134</span> to permanently delete this profile and its runs.</p>

                                <input
                                    type="password"
                                    maxLength="3"
                                    value={accountPinInput}
                                    onChange={(e) => setAccountPinInput(e.target.value)}
                                    placeholder="Enter PIN"
                                    className="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2.5 text-center text-lg text-white mb-2 font-mono tracking-widest focus:outline-none focus:border-primary"
                                />
                                {accountDeleteErrorMsg && <div className="text-xs text-red-400 mb-4 text-center font-mono">{accountDeleteErrorMsg}</div>}

                                <div className="flex gap-3 mt-4">
                                    <button
                                        onClick={() => setShowAccountDeleteModal(false)}
                                        className="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-xs rounded-xl transition-all"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={confirmDeleteAccount}
                                        className="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl transition-all"
                                    >
                                        Delete Account
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CAMERA CAPTURE */}
                    {showCameraModal && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
                            <div className="bg-card border border-zinc-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl flex flex-col items-center">
                                <h3 className="text-lg font-bold text-white mb-3">CAPTURE PILOT PHOTO</h3>
                                <div className="relative w-full aspect-square bg-black rounded-2xl overflow-hidden mb-4 border border-zinc-800">
                                    <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover"></video>
                                </div>
                                <canvas ref={canvasRef} className="hidden"></canvas>

                                <div className="flex gap-3 w-full">
                                    <button
                                        onClick={() => { stopCameraStream(); setShowCameraModal(false); }}
                                        className="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-xs rounded-xl transition-all"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={capturePhoto}
                                        className="flex-1 py-3 bg-primary hover:bg-primary-hover text-black font-bold text-xs rounded-xl transition-all"
                                    >
                                        Capture
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
