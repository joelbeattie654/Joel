---
layout: app
title: "319 doors"
description: "319 door challenge hub"
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House 319 Door Challenge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #060608;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
</head>
<body class="bg-[#060608] text-zinc-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Lucide icon components wrapper
        const Trophy = (props) => <i data-lucide="trophy" {...props}></i>;
        const Play = (props) => <i data-lucide="play" {...props}></i>;
        const Square = (props) => <i data-lucide="square" {...props}></i>;
        const User = (props) => <i data-lucide="user" {...props}></i>;
        const Plus = (props) => <i data-lucide="plus" {...props}></i>;
        const Settings = (props) => <i data-lucide="settings" {...props}></i>;
        const Check = (props) => <i data-lucide="check" {...props}></i>;
        const ChevronDown = (props) => <i data-lucide="chevron-down" {...props}></i>;
        const Sparkles = (props) => <i data-lucide="sparkles" {...props}></i>;
        const AlertCircle = (props) => <i data-lucide="alert-circle" {...props}></i>;
        const RotateCcw = (props) => <i data-lucide="rotate-ccw" {...props}></i>;
        const Trash2 = (props) => <i data-lucide="trash-2" {...props}></i>;
        const Database = (props) => <i data-lucide="database" {...props}></i>;
        const Award = (props) => <i data-lucide="award" {...props}></i>;
        const HelpCircle = (props) => <i data-lucide="help-circle" {...props}></i>;
        const Lock = (props) => <i data-lucide="lock" {...props}></i>;
        const Camera = (props) => <i data-lucide="camera" {...props}></i>;
        const Upload = (props) => <i data-lucide="upload" {...props}></i>;
        const Edit2 = (props) => <i data-lucide="edit-2" {...props}></i>;

        let supabase = null;
        const initSupabase = (url, key) => {
          try {
            if (url && key && window.supabase) {
              supabase = window.supabase.createClient(url, key);
              return true;
            }
          } catch (e) {
            console.error("Supabase init error:", e);
          }
          return false;
        };

        const DEFAULT_PROFILES = [
          { id: 'demo-1', name: 'Alex Rivera', avatar_url: '⚡', created_at: new Date().toISOString() },
          { id: 'demo-2', name: 'Sarah Connor', avatar_url: '🔥', created_at: new Date().toISOString() },
          { id: 'demo-3', name: 'David 319', avatar_url: '🛡️', created_at: new Date().toISOString() }
        ];

        const DEFAULT_ATTEMPTS = [
          { 
            id: 'att-1', 
            profile_id: 'demo-1', 
            time_ms: 54320, 
            notes: 'Clean run through kitchen & living room!', 
            created_at: new Date(Date.now() - 3600000 * 2).toISOString(),
            profiles: { name: 'Alex Rivera', avatar_url: '⚡' }
          },
          { 
            id: 'att-2', 
            profile_id: 'demo-2', 
            time_ms: 61050, 
            notes: 'Stumbled on the upstairs hallway rug.', 
            created_at: new Date(Date.now() - 3600000 * 24).toISOString(),
            profiles: { name: 'Sarah Connor', avatar_url: '🔥' }
          },
          { 
            id: 'att-3', 
            profile_id: 'demo-3', 
            time_ms: 48900, 
            notes: 'God tier routing. Zero door bounce.', 
            created_at: new Date(Date.now() - 3600000 * 48).toISOString(),
            profiles: { name: 'David 319', avatar_url: '🛡️' }
          }
        ];

        function App() {
          const [activeTab, setActiveTab] = useState('timer');
          const [isDemoMode, setIsDemoMode] = useState(true);
          const [supabaseUrl, setSupabaseUrl] = useState(localStorage.getItem('h319_sb_url') || '');
          const [supabaseKey, setSupabaseKey] = useState(localStorage.getItem('h319_sb_key') || '');
          const [isConnected, setIsConnected] = useState(false);

          const [profiles, setProfiles] = useState([]);
          const [activeProfile, setActiveProfile] = useState(null);
          const [attempts, setAttempts] = useState([]);
          const [loading, setLoading] = useState(true);
          const [errorMsg, setErrorMsg] = useState(null);

          const [timerState, setTimerState] = useState('idle');
          const [elapsedMs, setElapsedMs] = useState(0);
          const [attemptNotes, setAttemptNotes] = useState('');
          const [showSaveModal, setShowSaveModal] = useState(false);
          const startTimeRef = useRef(null);
          const requestRef = useRef(null);

          const [showProfileDropdown, setShowProfileDropdown] = useState(false);
          const [showNewProfileModal, setShowNewProfileModal] = useState(false);
          const [newProfileName, setNewProfileName] = useState('');
          const [newProfileEmoji, setNewProfileEmoji] = useState('⚡');
          const [newProfilePhoto, setNewProfilePhoto] = useState(null);

          // Edit profile state
          const [showEditProfileModal, setShowEditProfileModal] = useState(false);
          const [profileToEdit, setProfileToEdit] = useState(null);
          const [editProfileName, setEditProfileName] = useState('');
          const [editProfilePhoto, setEditProfilePhoto] = useState(null);

          // Camera capture states
          const [isCameraActive, setIsCameraActive] = useState(false);
          const videoRef = useRef(null);
          const canvasRef = useRef(null);

          const [showDeleteModal, setShowDeleteModal] = useState(false);
          const [attemptToDelete, setAttemptToDelete] = useState(null);
          const [deletePinInput, setDeletePinInput] = useState('');
          const [deleteErrorMsg, setDeleteErrorMsg] = useState('');

          const [leaderboardFilter, setLeaderboardFilter] = useState('all');

          useEffect(() => {
            if (!window.supabase) {
              const script = document.createElement('script');
              script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
              script.async = true;
              script.onload = () => {
                if (supabaseUrl && supabaseKey) {
                  const success = initSupabase(supabaseUrl, supabaseKey);
                  if (success) {
                    setIsConnected(true);
                    setIsDemoMode(false);
                  }
                }
              };
              document.body.appendChild(script);
            } else {
              if (supabaseUrl && supabaseKey) {
                const success = initSupabase(supabaseUrl, supabaseKey);
                if (success) {
                  setIsConnected(true);
                  setIsDemoMode(false);
                }
              }
            }
            loadData();
          }, [isDemoMode, supabaseUrl, supabaseKey]);

          useEffect(() => {
            setTimeout(() => {
              if (window.lucide) {
                window.lucide.createIcons();
              }
            }, 50);
          });

          const loadData = async () => {
            setLoading(true);
            setErrorMsg(null);

            if (isDemoMode || !window.supabase) {
              const savedProfiles = JSON.parse(localStorage.getItem('h319_profiles')) || DEFAULT_PROFILES;
              const savedAttempts = JSON.parse(localStorage.getItem('h319_attempts')) || DEFAULT_ATTEMPTS;
              setProfiles(savedProfiles);
              setAttempts(savedAttempts);
              if (savedProfiles.length > 0 && !activeProfile) {
                setActiveProfile(savedProfiles[0]);
              }
              setLoading(false);
              return;
            }

            try {
              const { data: profData, error: profErr } = await supabase
                .from('profiles')
                .select('*')
                .order('created_at', { ascending: false });

              if (profErr) throw profErr;

              const { data: attData, error: attErr } = await supabase
                .from('attempts')
                .select('*, profiles(name, avatar_url)')
                .order('time_ms', { ascending: true });

              if (attErr) throw attErr;

              setProfiles(profData || []);
              setAttempts(attData || []);

              if (profData && profData.length > 0 && !activeProfile) {
                setActiveProfile(profData[0]);
              }
            } catch (err) {
              console.error("Error loading from Supabase:", err);
              setErrorMsg("Failed to connect to Supabase. Switched to local demo mode.");
              setIsDemoMode(true);
            } finally {
              setLoading(false);
            }
          };

          const startCamera = async () => {
            setIsCameraActive(true);
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
              }
            } catch (err) {
              console.error("Camera access error:", err);
              setErrorMsg("Unable to access camera. Please allow camera permissions or upload an image file.");
              setIsCameraActive(false);
            }
          };

          const capturePhoto = (isEditing = false) => {
            if (videoRef.current && canvasRef.current) {
              const video = videoRef.current;
              const canvas = canvasRef.current;
              canvas.width = video.videoWidth || 320;
              canvas.height = video.videoHeight || 240;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              const dataUrl = canvas.toDataURL('image/jpeg');
              if (isEditing) {
                setEditProfilePhoto(dataUrl);
              } else {
                setNewProfilePhoto(dataUrl);
              }
              stopCameraStream();
            }
          };

          const stopCameraStream = () => {
            if (videoRef.current && videoRef.current.srcObject) {
              const stream = videoRef.current.srcObject;
              stream.getTracks().forEach(track => track.stop());
              videoRef.current.srcObject = null;
            }
            setIsCameraActive(false);
          };

          const handleFileUpload = (e, isEditing = false) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onloadend = () => {
                if (isEditing) {
                  setEditProfilePhoto(reader.result);
                } else {
                  setNewProfilePhoto(reader.result);
                }
              };
              reader.readAsDataURL(file);
            }
          };

          const updateTimer = () => {
            if (startTimeRef.current !== null) {
              const now = performance.now();
              setElapsedMs(Math.floor(now - startTimeRef.current));
              requestRef.current = requestAnimationFrame(updateTimer);
            }
          };

          const startTimer = () => {
            if (!activeProfile) {
              setShowNewProfileModal(true);
              return;
            }
            setElapsedMs(0);
            startTimeRef.current = performance.now();
            setTimerState('running');
            requestRef.current = requestAnimationFrame(updateTimer);
          };

          const stopTimer = () => {
            if (requestRef.current) {
              cancelAnimationFrame(requestRef.current);
            }
            setTimerState('stopped');
            setShowSaveModal(true);
          };

          const resetTimer = () => {
            if (requestRef.current) {
              cancelAnimationFrame(requestRef.current);
            }
            setTimerState('idle');
            setElapsedMs(0);
            setAttemptNotes('');
            setShowSaveModal(false);
          };

          const saveAttempt = async () => {
            if (!activeProfile) return;

            const newTimeMs = elapsedMs;
            const newNotes = attemptNotes || 'Standard speedrun attempt';
            const newCreatedAt = new Date().toISOString();

            if (isDemoMode || !window.supabase) {
              const existingUserAttempt = attempts.find(a => a.profile_id === activeProfile.id);
              const isNewBest = !existingUserAttempt || newTimeMs < existingUserAttempt.time_ms;

              if (!isNewBest) {
                resetTimer();
                setActiveTab('leaderboard');
                return;
              }

              const filteredAttempts = attempts.filter(a => a.profile_id !== activeProfile.id);
              const fullAttempt = {
                id: 'att-' + Date.now(),
                profile_id: activeProfile.id,
                time_ms: newTimeMs,
                notes: newNotes,
                created_at: newCreatedAt,
                profiles: { name: activeProfile.name, avatar_url: activeProfile.avatar_url }
              };

              const updatedAttempts = [fullAttempt, ...filteredAttempts].sort((a, b) => a.time_ms - b.time_ms);
              setAttempts(updatedAttempts);
              localStorage.setItem('h319_attempts', JSON.stringify(updatedAttempts));
              handleSaveSuccess(fullAttempt, updatedAttempts, true);
            } else {
              try {
                const { data: existingUserAttempts, error: fetchErr } = await supabase
                  .from('attempts')
                  .select('*')
                  .eq('profile_id', activeProfile.id);

                if (fetchErr) throw fetchErr;

                let isNewBest = true;
                if (existingUserAttempts && existingUserAttempts.length > 0) {
                  const currentBest = existingUserAttempts[0];
                  if (newTimeMs >= currentBest.time_ms) {
                    isNewBest = false;
                  }
                }

                if (!isNewBest) {
                  resetTimer();
                  setActiveTab('leaderboard');
                  return;
                }

                await supabase.from('attempts').delete().eq('profile_id', activeProfile.id);

                const { data, error } = await supabase
                  .from('attempts')
                  .insert([{
                    profile_id: activeProfile.id,
                    time_ms: newTimeMs,
                    notes: newNotes,
                    created_at: newCreatedAt
                  }])
                  .select('*, profiles(name, avatar_url)')
                  .single();

                if (error) throw error;
                
                const filtered = attempts.filter(a => a.profile_id !== activeProfile.id);
                const updatedAttempts = [data, ...filtered].sort((a, b) => a.time_ms - b.time_ms);
                setAttempts(updatedAttempts);
                handleSaveSuccess(data, updatedAttempts, true);
              } catch (err) {
                console.error("Error saving attempt:", err);
              }
            }
          };

          const handleSaveSuccess = (savedAtt, allAtts, isNewBest) => {
            const isHouseRecord = allAtts.length > 0 && allAtts[0].id === savedAtt.id;
            if ((isHouseRecord || isNewBest) && window.confetti) {
              window.confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 },
                colors: ['#facc15', '#eab308', '#ffffff', '#22c55e']
              });
            }
            setShowSaveModal(false);
            setTimerState('idle');
            setActiveTab('leaderboard');
          };

          const confirmDeleteAttempt = (att) => {
            if (!activeProfile || att.profile_id !== activeProfile.id) {
              setErrorMsg("Security Protocol: You can only delete your own speedrun records!");
              return;
            }
            setAttemptToDelete(att);
            setDeletePinInput('');
            setDeleteErrorMsg('');
            setShowDeleteModal(true);
          };

          const executeDeleteAttempt = async () => {
            if (!attemptToDelete) return;

            if (deletePinInput.trim() !== '314') {
              setDeleteErrorMsg('Invalid security PIN. Enter 314 to authorize deletion.');
              return;
            }

            if (isDemoMode || !window.supabase) {
              const updated = attempts.filter(a => a.id !== attemptToDelete.id);
              setAttempts(updated);
              localStorage.setItem('h319_attempts', JSON.stringify(updated));
              setShowDeleteModal(false);
              setAttemptToDelete(null);
              setDeletePinInput('');
            } else {
              try {
                const { error } = await supabase
                  .from('attempts')
                  .delete()
                  .eq('id', attemptToDelete.id);

                if (error) throw error;

                const updated = attempts.filter(a => a.id !== attemptToDelete.id);
                setAttempts(updated);
                setShowDeleteModal(false);
                setAttemptToDelete(null);
                setDeletePinInput('');
              } catch (err) {
                console.error("Error deleting attempt:", err);
                setDeleteErrorMsg('Database error while deleting record.');
              }
            }
          };

          const handleCreateProfile = async (e) => {
            e.preventDefault();
            if (!newProfileName.trim()) return;

            const avatarVal = newProfilePhoto || newProfileEmoji;

            if (isDemoMode || !window.supabase) {
              const newProf = {
                id: 'prof-' + Date.now(),
                name: newProfileName.trim(),
                avatar_url: avatarVal,
                created_at: new Date().toISOString()
              };
              const updated = [newProf, ...profiles];
              setProfiles(updated);
              setActiveProfile(newProf);
              localStorage.setItem('h319_profiles', JSON.stringify(updated));
              setNewProfileName('');
              setNewProfilePhoto(null);
              setShowNewProfileModal(false);
            } else {
              try {
                const { data, error } = await supabase
                  .from('profiles')
                  .insert([{ name: newProfileName.trim(), avatar_url: avatarVal }])
                  .select()
                  .single();

                if (error) throw error;

                const updated = [data, ...profiles];
                setProfiles(updated);
                setActiveProfile(data);
                setNewProfileName('');
                setNewProfilePhoto(null);
                setShowNewProfileModal(false);
              } catch (err) {
                console.error("Error creating profile:", err);
              }
            }
          };

          const handleUpdateProfile = async (e) => {
            e.preventDefault();
            if (!profileToEdit || !editProfileName.trim()) return;

            const updatedAvatar = editProfilePhoto || profileToEdit.avatar_url;

            if (isDemoMode || !window.supabase) {
              const updatedProfiles = profiles.map(p => p.id === profileToEdit.id ? { ...p, name: editProfileName.trim(), avatar_url: updatedAvatar } : p);
              setProfiles(updatedProfiles);
              if (activeProfile?.id === profileToEdit.id) {
                setActiveProfile({ ...activeProfile, name: editProfileName.trim(), avatar_url: updatedAvatar });
              }
              // Update attempts profiles cache as well
              const updatedAttempts = attempts.map(att => att.profile_id === profileToEdit.id ? { ...att, profiles: { ...att.profiles, name: editProfileName.trim(), avatar_url: updatedAvatar } } : att);
              setAttempts(updatedAttempts);
              localStorage.setItem('h319_profiles', JSON.stringify(updatedProfiles));
              localStorage.setItem('h319_attempts', JSON.stringify(updatedAttempts));
              setShowEditProfileModal(false);
              setProfileToEdit(null);
            } else {
              try {
                const { data, error } = await supabase
                  .from('profiles')
                  .update({ name: editProfileName.trim(), avatar_url: updatedAvatar })
                  .eq('id', profileToEdit.id)
                  .select()
                  .single();

                if (error) throw error;

                const updatedProfiles = profiles.map(p => p.id === data.id ? data : p);
                setProfiles(updatedProfiles);
                if (activeProfile?.id === data.id) {
                  setActiveProfile(data);
                }
                loadData();
                setShowEditProfileModal(false);
                setProfileToEdit(null);
              } catch (err) {
                console.error("Error updating profile:", err);
              }
            }
          };

          const formatTime = (ms) => {
            const totalSecs = Math.floor(ms / 1000);
            const mins = Math.floor(totalSecs / 60);
            const secs = totalSecs % 60;
            const centis = Math.floor((ms % 1000) / 10);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(centis).padStart(2, '0')}`;
          };

          const filteredAttempts = attempts.filter(att => {
            if (leaderboardFilter === 'personal') {
              return activeProfile && att.profile_id === activeProfile.id;
            }
            return true;
          });

          const renderAvatar = (avatarValue, sizeClasses = "w-8 h-8 rounded-lg") => {
            if (avatarValue && (avatarValue.startsWith('data:image') || avatarValue.startsWith('http'))) {
              return <img src={avatarValue} alt="Pilot Avatar" className={`${sizeClasses} object-cover`} />;
            }
            return (
              <div className={`${sizeClasses} bg-yellow-400/20 border border-yellow-400/40 flex items-center justify-center text-base`}>
                {avatarValue || '⚡'}
              </div>
            );
          };

          return (
            <div className="min-h-screen bg-[#060608] text-zinc-100 flex flex-col font-sans">
              
              {/* Header */}
              <header className="sticky top-0 z-40 w-full border-b border-zinc-800/80 bg-zinc-950/90 backdrop-blur-xl">
                <div className="max-w-6xl mx-auto px-4 h-18 flex items-center justify-between">
                  <div className="flex items-center gap-3.5">
                    <div className="w-11 h-11 rounded-xl bg-gradient-to-tr from-yellow-500 via-amber-400 to-yellow-300 p-[2px] shadow-lg shadow-yellow-500/25 rotate-[-3deg]">
                      <div className="w-full h-full bg-zinc-950 rounded-[10px] flex items-center justify-center text-yellow-400 font-black text-lg tracking-tighter">
                        319
                      </div>
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-black text-white tracking-wider text-base sm:text-lg uppercase italic">HOUSE <span className="text-yellow-400">319</span></span>
                        <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-md bg-yellow-400/15 text-yellow-300 border border-yellow-400/30 uppercase tracking-widest">
                          SPEEDRUN HUD
                        </span>
                      </div>
                      <p className="text-[11px] font-mono text-zinc-400 tracking-tight">TELEMETRY & DOOR TIME ATTACK</p>
                    </div>
                  </div>

                  {/* Profile Dropdown */}
                  <div className="relative">
                    <button
                      onClick={() => setShowProfileDropdown(!showProfileDropdown)}
                      className="flex items-center gap-3 px-4 py-2.5 rounded-xl bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-800 transition-all shadow-md group cursor-pointer"
                    >
                      {renderAvatar(activeProfile?.avatar_url, "w-8 h-8 rounded-lg")}
                      <div className="text-left hidden sm:block">
                        <div className="text-xs font-bold text-zinc-200 group-hover:text-white uppercase tracking-wider">
                          {activeProfile ? activeProfile.name : 'Select Driver'}
                        </div>
                        <div className="text-[10px] font-mono text-yellow-400/90 font-semibold">ACTIVE PILOT</div>
                      </div>
                      <ChevronDown className="w-4 h-4 text-zinc-400 ml-1" />
                    </button>

                    {showProfileDropdown && (
                      <div className="absolute right-0 mt-2 w-64 rounded-2xl bg-zinc-900 border border-zinc-800 shadow-2xl p-2 z-50">
                        <div className="px-3 py-2 text-[10px] font-mono uppercase tracking-widest text-zinc-500 border-b border-zinc-800">
                          Household Pilots
                        </div>
                        <div className="py-1 max-h-48 overflow-y-auto space-y-1">
                          {profiles.map(p => (
                            <button
                              key={p.id}
                              onClick={() => {
                                setActiveProfile(p);
                                setShowProfileDropdown(false);
                              }}
                              className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-bold transition-all cursor-pointer ${activeProfile?.id === p.id ? 'bg-yellow-400 text-zinc-950 shadow-md' : 'text-zinc-300 hover:bg-zinc-800 hover:text-white'}`}
                            >
                              <div className="flex items-center gap-2.5">
                                {renderAvatar(p.avatar_url, "w-6 h-6 rounded-md")}
                                <span>{p.name}</span>
                              </div>
                              {activeProfile?.id === p.id && <Check className="w-3.5 h-3.5" />}
                            </button>
                          ))}
                        </div>
                        <div className="pt-1 mt-1 border-t border-zinc-800">
                          <button
                            onClick={() => {
                              setShowProfileDropdown(false);
                              setShowNewProfileModal(true);
                            }}
                            className="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl text-xs font-bold text-yellow-400 hover:bg-yellow-400/10 transition-colors cursor-pointer"
                          >
                            <Plus className="w-4 h-4" /> Register New Pilot
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </header>

              {/* Main Content Area */}
              <div className="max-w-6xl mx-auto w-full px-4 py-8 flex-1 flex flex-col gap-6">
                
                {/* Tabs */}
                <div className="flex items-center justify-between border-b border-zinc-800 pb-4">
                  <div className="flex items-center gap-1 sm:gap-2">
                    <button
                      onClick={() => setActiveTab('timer')}

                                type="button"
                                onClick={startCamera}
                                className="flex-1 py-2 px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-mono font-bold text-zinc-200 uppercase flex items-center justify-center gap-1.5 cursor-pointer"
                              >
                                <Camera className="w-3.5 h-3.5 text-yellow-400" /> Take Photo
                              </button>
                              <label className="flex-1 py-2 px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-mono font-bold text-zinc-200 uppercase flex items-center justify-center gap-1.5 cursor-pointer">
                                <Upload className="w-3.5 h-3.5 text-yellow-400" /> Upload File
                                <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, true)} className="hidden" />
                              </label>
                            </div>
                            <div className="flex gap-1.5 justify-center">
                              {['⚡', '🔥', '🛡️', '👑', '🚀', '🎯'].map(emoji => (
                                <button
                                  type="button"
                                  key={emoji}
                                  onClick={() => setEditProfilePhoto(emoji)}
                                  className={`w-8 h-8 rounded-lg text-sm flex items-center justify-center border transition-all cursor-pointer bg-zinc-950 border-zinc-800 text-zinc-400 hover:border-yellow-400`}
                                >
                                  {emoji}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>

                        {isCameraActive && (
                          <div className="p-3 rounded-2xl bg-zinc-950 border border-zinc-800 space-y-3">
                            <div className="relative rounded-xl overflow-hidden bg-black aspect-video flex items-center justify-center">
                              <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover"></video>
                              <canvas ref={canvasRef} className="hidden"></canvas>
                            </div>
                            <div className="flex gap-2">
                              <button
                                type="button"
                                onClick={() => capturePhoto(true)}
                                className="flex-1 py-2.5 rounded-xl bg-yellow-400 text-zinc-950 text-xs font-black uppercase tracking-wider cursor-pointer"
                              >
                                Capture Snapshot 📸
                              </button>
                              <button
                                type="button"
                                onClick={stopCameraStream}
                                className="px-4 py-2.5 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-mono uppercase cursor-pointer"
                              >
                                Cancel
                              </button>
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="flex items-center gap-3 pt-2">
                        <button
                          type="button"
                          onClick={() => {
                            stopCameraStream();
                            setShowEditProfileModal(false);
                          }}
                          className="w-1/2 py-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-mono font-bold uppercase tracking-wider transition-colors cursor-pointer"
                        >
                          Cancel
                        </button>
                        <button
                          type="submit"
                          className="w-1/2 py-3 rounded-xl bg-yellow-400 hover:bg-yellow-300 text-zinc-950 text-xs font-black uppercase tracking-wider shadow-lg cursor-pointer"
                        >
                          Save Changes
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* New Profile Modal */}
              {showNewProfileModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950/80 backdrop-blur-md">
                  <div className="w-full max-w-md rounded-3xl bg-zinc-900 border border-zinc-800 p-6 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
                    <div>
                      <h3 className="text-lg font-black text-white uppercase tracking-wider">Register New Pilot</h3>
                      <p className="text-xs font-mono text-zinc-400 mt-1">Create a driver profile and take a picture or pick an avatar.</p>
                    </div>

                    <form onSubmit={handleCreateProfile} className="space-y-4">
                      <div>
                        <label className="block text-xs font-mono font-bold text-zinc-300 uppercase tracking-wider mb-2">Pilot Call Sign / Name</label>
                        <input
                          type="text"
                          placeholder="e.g. Lando 319"
                          value={newProfileName}
                          onChange={(e) => setNewProfileName(e.target.value)}
                          className="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-sm text-zinc-100 font-mono focus:outline-none focus:border-yellow-400"
                          required
                          autoFocus
                        />
                      </div>

                      <div className="space-y-3">
                        <label className="block text-xs font-mono font-bold text-zinc-300 uppercase tracking-wider">Profile Avatar / Photo</label>
                        
                        <div className="flex items-center gap-4">
                          <div className="w-16 h-16 rounded-2xl bg-zinc-950 border border-zinc-800 overflow-hidden flex items-center justify-center shrink-0">
                            {newProfilePhoto ? (
                              <img src={newProfilePhoto} alt="Preview" className="w-full h-full object-cover" />
                            ) : (
                              <span className="text-2xl">{newProfileEmoji}</span>
                            )}
                          </div>

                          <div className="flex flex-col gap-2 flex-1">
                            <div className="flex gap-2">
                              <button
                                type="button"
                                onClick={startCamera}
                                className="flex-1 py-2 px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-mono font-bold text-zinc-200 uppercase flex items-center justify-center gap-1.5 cursor-pointer"
                              >
                                <Camera className="w-3.5 h-3.5 text-yellow-400" /> Take Photo
                              </button>
                              <label className="flex-1 py-2 px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-mono font-bold text-zinc-200 uppercase flex items-center justify-center gap-1.5 cursor-pointer">
                                <Upload className="w-3.5 h-3.5 text-yellow-400" /> Upload File
                                <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, false)} className="hidden" />
                              </label>
                            </div>
                            <div className="flex gap-1.5 justify-center">
                              {['⚡', '🔥', '🛡️', '👑', '🚀', '🎯'].map(emoji => (
                                <button
                                  type="button"
                                  key={emoji}
                                  onClick={() => {
                                    setNewProfilePhoto(null);
                                    setNewProfileEmoji(emoji);
                                  }}
                                  className={`w-8 h-8 rounded-lg text-sm flex items-center justify-center border transition-all cursor-pointer ${!newProfilePhoto && newProfileEmoji === emoji ? 'bg-yellow-400/20 border-yellow-400 text-white' : 'bg-zinc-950 border-zinc-800 text-zinc-400'}`}
                                >
                                  {emoji}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>

                        {isCameraActive && (
                          <div className="p-3 rounded-2xl bg-zinc-950 border border-zinc-800 space-y-3">
                            <div className="relative rounded-xl overflow-hidden bg-black aspect-video flex items-center justify-center">
                              <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover"></video>
                              <canvas ref={canvasRef} className="hidden"></canvas>
                            </div>
                            <div className="flex gap-2">
                              <button
                                type="button"
                                onClick={() => capturePhoto(false)}
                                className="flex-1 py-2.5 rounded-xl bg-yellow-400 text-zinc-950 text-xs font-black uppercase tracking-wider cursor-pointer"
                              >
                                Capture Snapshot 📸
                              </button>
                              <button
                                type="button"
                                onClick={stopCameraStream}
                                className="px-4 py-2.5 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-mono uppercase cursor-pointer"
                              >
                                Cancel
                              </button>
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="flex items-center gap-3 pt-2">
                        <button
                          type="button"
                          onClick={() => {
                            stopCameraStream();
                            setShowNewProfileModal(false);
                          }}
                          className="w-1/2 py-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-mono font-bold uppercase tracking-wider transition-colors cursor-pointer"
                        >
                          Cancel
                        </button>
                        <button
                          type="submit"
                          className="w-1/2 py-3 rounded-xl bg-yellow-400 hover:bg-yellow-300 text-zinc-950 text-xs font-black uppercase tracking-wider shadow-lg cursor-pointer"
                        >
                          Register Pilot
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
