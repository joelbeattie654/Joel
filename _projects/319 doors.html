<script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // ==========================================
    // HARDCODED SUPABASE CONFIGURATION
    // ==========================================
    const SUPABASE_URL = "YOUR_SUPABASE_URL_HERE"; // Replace with your project URL if desired
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE"; // Replace with your anon key if desired

    // Safe SVG Icon Components
    const Trophy = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
    );
    const Play = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
    );
    const Square = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
    );
    const User = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    );
    const Plus = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    );
    const Check = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    );
    const ChevronDown = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    );
    const Sparkles = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/></svg>
    );
    const AlertCircle = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    );
    const RotateCcw = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    );
    const Trash2 = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
    );
    const Award = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
    );
    const HelpCircle = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
    );
    const Lock = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    );
    const Camera = (props) => (
      <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    );

    let supabase = null;
    const initSupabase = (url, key) => {
      try {
        if (url && key && url !== "YOUR_SUPABASE_URL_HERE" && window.supabase) {
          supabase = window.supabase.createClient(url, key);
          return true;
        }
      } catch (e) {
        console.error("Supabase init error:", e);
      }
      return false;
    };

    const DEFAULT_PROFILES = [
      { id: 'demo-1', name: 'Alex Rivera', avatar_url: '⚡', created_at: new Date().toISOString() },
      { id: 'demo-2', name: 'Sarah Connor', avatar_url: '🔥', created_at: new Date().toISOString() },
      { id: 'demo-3', name: 'David 319', avatar_url: '🛡️', created_at: new Date().toISOString() }
    ];

    const DEFAULT_ATTEMPTS = [
      { 
        id: 'att-1', 
        profile_id: 'demo-1', 
        time_ms: 54320, 
        notes: 'Clean run through kitchen & living room!', 
        created_at: new Date(Date.now() - 3600000 * 2).toISOString(),
        profiles: { name: 'Alex Rivera', avatar_url: '⚡' }
      },
      { 
        id: 'att-2', 
        profile_id: 'demo-2', 
        time_ms: 61050, 
        notes: 'Stumbled on the upstairs hallway rug.', 
        created_at: new Date(Date.now() - 3600000 * 24).toISOString(),
        profiles: { name: 'Sarah Connor', avatar_url: '🔥' }
      },
      { 
        id: 'att-3', 
        profile_id: 'demo-3', 
        time_ms: 48900, 
        notes: 'God tier routing. Zero door bounce.', 
        created_at: new Date(Date.now() - 3600000 * 48).toISOString(),
        profiles: { name: 'David 319', avatar_url: '🛡️' }
      }
    ];

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an error", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 max-w-xl mx-auto mt-20 rounded-3xl bg-zinc-900 border border-red-500/50 text-center space-y-4">
              <h2 className="text-xl font-black text-white uppercase">Something went wrong</h2>
              <p className="text-xs font-mono text-red-400">{this.state.error?.toString()}</p>
              <button onClick={() => window.location.reload()} className="px-6 py-2.5 rounded-xl bg-yellow-400 text-zinc-950 font-bold text-xs uppercase cursor-pointer">
                Reload App
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      const [activeTab, setActiveTab] = useState('timer');
      const [isDemoMode, setIsDemoMode] = useState(true);

      const [profiles, setProfiles] = useState([]);
      const [activeProfile, setActiveProfile] = useState(null);
      const [attempts, setAttempts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState(null);

      const [timerState, setTimerState] = useState('idle');
      const [elapsedMs, setElapsedMs] = useState(0);
      const [attemptNotes, setAttemptNotes] = useState('');
      const [showSaveModal, setShowSaveModal] = useState(false);
      const startTimeRef = useRef(null);
      const requestRef = useRef(null);

      const [showProfileDropdown, setShowProfileDropdown] = useState(false);
      const [showNewProfileModal, setShowNewProfileModal] = useState(false);
      const [newProfileName, setNewProfileName] = useState('');
      const [newProfileEmoji, setNewProfileEmoji] = useState('⚡');
      const [newProfileImage, setNewProfileImage] = useState(null);

      // Edit profile state
      const [showEditProfileModal, setShowEditProfileModal] = useState(false);
      const [editProfileName, setEditProfileName] = useState('');
      const [editProfileEmoji, setEditProfileEmoji] = useState('⚡');
      const [editProfileImage, setEditProfileImage] = useState(null);

      // Delete run confirmation modal state (PIN 134 required)
      const [showDeleteModal, setShowDeleteModal] = useState(false);
      const [attemptToDelete, setAttemptToDelete] = useState(null);
      const [deletePinInput, setDeletePinInput] = useState('');
      const [deleteErrorMsg, setDeleteErrorMsg] = useState('');

      // Delete account confirmation modal state (PIN 134 required)
      const [showDeleteAccountModal, setShowDeleteAccountModal] = useState(false);
      const [accountDeletePin, setAccountDeletePin] = useState('');
      const [accountDeleteError, setAccountDeleteError] = useState('');

      const [leaderboardFilter, setLeaderboardFilter] = useState('all');

      useEffect(() => {
        try {
          const success = initSupabase(SUPABASE_URL, SUPABASE_ANON_KEY);
          if (success) {
            setIsDemoMode(false);
          } else {
            setIsDemoMode(true);
          }
          loadData();
        } catch (err) {
          console.error("Init effect error:", err);
        }
      }, []);

      const loadData = async () => {
        try {
          setLoading(true);
          setErrorMsg(null);

          if (isDemoMode || !supabase) {
            const savedProfiles = JSON.parse(localStorage.getItem('h319_profiles')) || DEFAULT_PROFILES;
            const savedAttempts = JSON.parse(localStorage.getItem('h319_attempts')) || DEFAULT_ATTEMPTS;
            setProfiles(savedProfiles);
            setAttempts(savedAttempts);
            if (savedProfiles.length > 0 && !activeProfile) {
              setActiveProfile(savedProfiles[0]);
            }
            setLoading(false);
            return;
          }

          const { data: profData, error: profErr } = await supabase
            .from('profiles')
            .select('*')
            .order('created_at', { ascending: false });

          if (profErr) throw profErr;

          const { data: attData, error: attErr } = await supabase
            .from('attempts')
            .select('*, profiles(name, avatar_url)')
            .order('time_ms', { ascending: true });

          if (attErr) throw attErr;

          setProfiles(profData || []);
          setAttempts(attData || []);

          if (profData && profData.length > 0 && !activeProfile) {
            setActiveProfile(profData[0]);
          }
        } catch (err) {
          console.error("Error loading from Supabase:", err);
          setErrorMsg("Failed to connect to Supabase. Switched to local demo mode.");
          setIsDemoMode(true);
        } finally {
          setLoading(false);
        }
      };

      const updateTimer = () => {
        if (startTimeRef.current !== null) {
          const now = performance.now();
          setElapsedMs(Math.floor(now - startTimeRef.current));
          requestRef.current = requestAnimationFrame(updateTimer);
        }
      };

      const startTimer = () => {
        if (!activeProfile) {
          setShowNewProfileModal(true);
          return;
        }
        setElapsedMs(0);
        startTimeRef.current = performance.now();
        setTimerState('running');
        requestRef.current = requestAnimationFrame(updateTimer);
      };

      const stopTimer = () => {
        if (requestRef.current) {
          cancelAnimationFrame(requestRef.current);
        }
        setTimerState('stopped');
        setShowSaveModal(true);
      };

      const resetTimer = () => {
        if (requestRef.current) {
          cancelAnimationFrame(requestRef.current);
        }
        setTimerState('idle');
        setElapsedMs(0);
        setAttemptNotes('');
        setShowSaveModal(false);
      };

      const saveAttempt = async () => {
        if (!activeProfile) return;

        const newTimeMs = elapsedMs;
        const newNotes = attemptNotes || 'Standard speedrun attempt';
        const newCreatedAt = new Date().toISOString();

        if (isDemoMode || !supabase) {
          const existingUserAttempt = attempts.find(a => a.profile_id === activeProfile.id);
          const isNewBest = !existingUserAttempt || newTimeMs < existingUserAttempt.time_ms;

          if (!isNewBest) {
            resetTimer();
            setActiveTab('leaderboard');
            return;
          }

          const filteredAttempts = attempts.filter(a => a.profile_id !== activeProfile.id);
          const fullAttempt = {
            id: 'att-' + Date.now(),
            profile_id: activeProfile.id,
            time_ms: newTimeMs,
            notes: newNotes,
            created_at: newCreatedAt,
            profiles: { name: activeProfile.name, avatar_url: activeProfile.avatar_url }
          };

          const updatedAttempts = [fullAttempt, ...filteredAttempts].sort((a, b) => a.time_ms - b.time_ms);
          setAttempts(updatedAttempts);
          localStorage.setItem('h319_attempts', JSON.stringify(updatedAttempts));
          handleSaveSuccess(fullAttempt, updatedAttempts, true);
        } else {
          try {
            const { data: existingUserAttempts, error: fetchErr } = await supabase
              .from('attempts')
              .select('*')
              .eq('profile_id', activeProfile.id);

            if (fetchErr) throw fetchErr;

            let isNewBest = true;
            if (existingUserAttempts && existingUserAttempts.length > 0) {
              const currentBest = existingUserAttempts[0];
              if (newTimeMs >= currentBest.time_ms) {
                isNewBest = false;
              }
            }

            if (!isNewBest) {
              resetTimer();
              setActiveTab('leaderboard');
              return;
            }

            await supabase.from('attempts').delete().eq('profile_id', activeProfile.id);

            const { data, error } = await supabase
              .from('attempts')
              .insert([{
                profile_id: activeProfile.id,
                time_ms: newTimeMs,
                notes: newNotes,
                created_at: newCreatedAt
              }])
              .select('*, profiles(name, avatar_url)')
              .single();

            if (error) throw error;
            
            const filtered = attempts.filter(a => a.profile_id !== activeProfile.id);
            const updatedAttempts = [data, ...filtered].sort((a, b) => a.time_ms - b.time_ms);
            setAttempts(updatedAttempts);
            handleSaveSuccess(data, updatedAttempts, true);
          } catch (err) {
            console.error("Error saving attempt:", err);
          }
        }
      };

      const handleSaveSuccess = (savedAtt, allAtts, isNewBest) => {
        const isHouseRecord = allAtts.length > 0 && allAtts[0].id === savedAtt.id;
        if ((isHouseRecord || isNewBest) && window.confetti) {
          window.confetti({
            particleCount: 150,
            spread: 90,
            origin: { y: 0.6 },
            colors: ['#facc15', '#eab308', '#ffffff', '#22c55e']
          });
        }
        setShowSaveModal(false);
        setTimerState('idle');
        setActiveTab('leaderboard');
      };

      const confirmDeleteAttempt = (att) => {
        if (!activeProfile || att.profile_id !== activeProfile.id) {
          setErrorMsg("Security Protocol: You can only delete your own speedrun records!");
          return;
        }
        setAttemptToDelete(att);
        setDeletePinInput('');
        setDeleteErrorMsg('');
        setShowDeleteModal(true);
      };

      const executeDeleteAttempt = async () => {
        if (!attemptToDelete) return;

        if (deletePinInput.trim() !== '134') {
          setDeleteErrorMsg('Invalid security PIN. Enter 134 to authorize deletion.');
          return;
        }

        if (isDemoMode || !supabase) {
          const updated = attempts.filter(a => a.id !== attemptToDelete.id);
          setAttempts(updated);
          localStorage.setItem('h319_attempts', JSON.stringify(updated));
          setShowDeleteModal(false);
          setAttemptToDelete(null);
          setDeletePinInput('');
        } else {
          try {
            const { error } = await supabase
              .from('attempts')
              .delete()
              .eq('id', attemptToDelete.id);

            if (error) throw error;

            const updated = attempts.filter(a => a.id !== attemptToDelete.id);
            setAttempts(updated);
            setShowDeleteModal(false);
            setAttemptToDelete(null);
            setDeletePinInput('');
          } catch (err) {
            console.error("Error deleting attempt:", err);
            setDeleteErrorMsg('Database error while deleting record.');
          }
        }
      };

      const executeDeleteAccount = async () => {
        if (!activeProfile) return;

        if (accountDeletePin.trim() !== '134') {
          setAccountDeleteError('Invalid PIN. Enter 134 to confirm account deletion.');
          return;
        }

        if (isDemoMode || !supabase) {
          const updatedProfiles = profiles.filter(p => p.id !== activeProfile.id);
          const updatedAttempts = attempts.filter(a => a.profile_id !== activeProfile.id);
          setProfiles(updatedProfiles);
          setAttempts(updatedAttempts);
          localStorage.setItem('h319_profiles', JSON.stringify(updatedProfiles));
          localStorage.setItem('h319_attempts', JSON.stringify(updatedAttempts));
          setActiveProfile(updatedProfiles.length > 0 ? updatedProfiles[0] : null);
          setShowDeleteAccountModal(false);
          setAccountDeletePin('');
          setAccountDeleteError('');
        } else {
          try {
            await supabase.from('attempts').delete().eq('profile_id', activeProfile.id);
            const { error } = await supabase.from('profiles').delete().eq('id', activeProfile.id);
            if (error) throw error;

            const updatedProfiles = profiles.filter(p => p.id !== activeProfile.id);
            const updatedAttempts = attempts.filter(a => a.profile_id !== activeProfile.id);
            setProfiles(updatedProfiles);
            setAttempts(updatedAttempts);
            setActiveProfile(updatedProfiles.length > 0 ? updatedProfiles[0] : null);
            setShowDeleteAccountModal(false);
            setAccountDeletePin('');
            setAccountDeleteError('');
          } catch (err) {
            console.error("Error deleting profile:", err);
            setAccountDeleteError('Database error deleting profile.');
          }
        }
      };

      const handleImageUpload = (e, setImageState) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setImageState(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleCreateProfile = async (e) => {
        e.preventDefault();
        if (!newProfileName.trim()) return;

        const avatarValue = newProfileImage || newProfileEmoji;

        if (isDemoMode || !supabase) {
          const newProf = {
            id: 'prof-' + Date.now(),
            name: newProfileName.trim(),
            avatar_url: avatarValue,
            created_at: new Date().toISOString()
          };
          const updated = [newProf, ...profiles];
          setProfiles(updated);
          setActiveProfile(newProf);
          localStorage.setItem('h319_profiles', JSON.stringify(updated));
          setNewProfileName('');
          setNewProfileImage(null);
          setShowNewProfileModal(false);
        } else {
          try {
            let finalAvatarUrl = avatarValue;
            if (newProfileImage && newProfileImage.startsWith('data:image')) {
              const base64Data = newProfileImage.split(',')[1];
              const byteCharacters = atob(base64Data);
              const byteNumbers = new Array(byteCharacters.length);
              for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
              }
              const byteArray = new Uint8Array(byteNumbers);
              const blob = new Blob([byteArray], { type: 'image/png' });
              const fileName = `avatar-${Date.now()}.png`;

              const { data: uploadData, error: uploadErr } = await supabase.storage
                .from('avatars')
                .upload(fileName, blob);

              if (!uploadErr) {
                const { data: publicURLData } = supabase.storage
                  .from('avatars')
                  .getPublicUrl(fileName);
                finalAvatarUrl = publicURLData.publicUrl;
              }
            }

            const { data, error } = await supabase
              .from('profiles')
              .insert([{ name: newProfileName.trim(), avatar_url: finalAvatarUrl }])
              .select()
              .single();

            if (error) throw error;

            const updated = [data, ...profiles];
            setProfiles(updated);
            setActiveProfile(data);
            setNewProfileName('');
            setNewProfileImage(null);
            setShowNewProfileModal(false);
          } catch (err) {
            console.error("Error creating profile:", err);
          }
        }
      };

      const handleUpdateProfile = async (e) => {
        e.preventDefault();
        if (!activeProfile || !editProfileName.trim()) return;

        const avatarValue = editProfileImage || editProfileEmoji;

        if (isDemoMode || !supabase) {
          const updatedProf = { ...activeProfile, name: editProfileName.trim(), avatar_url: avatarValue };
          const updatedProfiles = profiles.map(p => p.id === activeProfile.id ? updatedProf : p);
          setProfiles(updatedProfiles);
          setActiveProfile(updatedProf);
          localStorage.setItem('h319_profiles', JSON.stringify(updatedProfiles));
          setShowEditProfileModal(false);
        } else {
          try {
            let finalAvatarUrl = avatarValue;
            if (editProfileImage && editProfileImage.startsWith('data:image')) {
              const base64Data = editProfileImage.split(',')[1];
              const byteCharacters = atob(base64Data);
              const byteNumbers = new Array(byteCharacters.length);
              for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
              }
              const byteArray = new Uint8Array(byteNumbers);
              const blob = new Blob([byteArray], { type: 'image/png' });
              const fileName = `avatar-${Date.now()}.png`;

              const { data: uploadData, error: uploadErr } = await supabase.storage
                .from('avatars')
                .upload(fileName, blob);

              if (!uploadErr) {
                const { data: publicURLData } = supabase.storage
                  .from('avatars')
                  .getPublicUrl(fileName);
                finalAvatarUrl = publicURLData.publicUrl;
              }
            }

            const { data, error } = await supabase
              .from('profiles')
              .update({ name: editProfileName.trim(), avatar_url: finalAvatarUrl })
              .eq('id', activeProfile.id)
              .select()
              .single();

            if (error) throw error;

            const updatedProfiles = profiles.map(p => p.id === activeProfile.id ? data : p);
            setProfiles(updatedProfiles);
            setActiveProfile(data);
            setShowEditProfileModal(false);
          } catch (err) {
            console.error("Error updating profile:", err);
          }
        }
      };

      const formatTime = (ms) => {
        const totalSecs = Math.floor(ms / 1000);
        const mins = Math.floor(totalSecs / 60);
        const secs = totalSecs % 60;

          {/* Delete Account Modal (PIN 134) */}
          {showDeleteAccountModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950/80 backdrop-blur-md">
              <div className="w-full max-w-sm rounded-3xl bg-zinc-900 border border-zinc-800 p-6 shadow-2xl space-y-6 text-center">
                <div className="w-12 h-12 rounded-xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center mx-auto text-rose-400">
                  <Lock className="w-6 h-6" />
                </div>
                <div>
                  <h3 className="text-lg font-black text-white uppercase tracking-wider mb-1">Delete Account</h3>
                  <p className="text-xs font-mono text-zinc-400">Enter PIN <strong className="text-yellow-400">134</strong> to permanently delete <span className="text-white font-bold">{activeProfile?.name}</span> and their records.</p>
                </div>

                <div className="space-y-3">
                  <input
                    type="password"
                    maxLength="3"
                    placeholder="Enter PIN (134)"
                    value={accountDeletePin}
                    onChange={(e) => setAccountDeletePin(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-center text-lg font-mono text-white tracking-widest focus:outline-none focus:border-yellow-400"
                    autoFocus
                  />
                  {accountDeleteError && (
                    <p className="text-[11px] font-mono text-rose-400">{accountDeleteError}</p>
                  )}
                </div>

                <div className="flex items-center gap-3 pt-2">
                  <button
                    onClick={() => {
                      setShowDeleteAccountModal(false);
                      setAccountDeletePin('');
                      setAccountDeleteError('');
                    }}
                    className="w-1/2 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-mono font-bold uppercase tracking-wider transition-colors cursor-pointer"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={executeDeleteAccount}
                    className="w-1/2 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-mono font-black uppercase tracking-wider shadow-lg shadow-rose-600/30 transition-all cursor-pointer"
                  >
                    Delete Account
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* New Profile Modal */}
          {showNewProfileModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950/80 backdrop-blur-md">
              <div className="w-full max-w-md rounded-3xl bg-zinc-900 border border-zinc-800 p-6 shadow-2xl space-y-6">
                <div>
                  <h3 className="text-lg font-black text-white uppercase tracking-wider">Register New Pilot</h3>
                  <p className="text-xs font-mono text-zinc-400 mt-1">Create a driver profile to track leaderboard speedruns.</p>
                </div>

                <form onSubmit={handleCreateProfile} className="space-y-4">
                  <div>
                    <label className="block text-xs font-mono font-bold text-zinc-300 uppercase tracking-wider mb-2">Pilot Call Sign / Name</label>
                    <input
                      type="text"
                      placeholder="e.g. Lando 319"
                      value={newProfileName}
                      onChange={(e) => setNewProfileName(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-sm text-zinc-100 font-mono focus:outline-none focus:border-yellow-400"
                      required
                      autoFocus
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-mono font-bold text-zinc-300 uppercase tracking-wider mb-2">Profile Picture / Avatar</label>
                    <div className="flex items-center gap-3 mb-3">
                      <div className="w-14 h-14 rounded-xl bg-zinc-950 border border-zinc-800 flex items-center justify-center overflow-hidden shrink-0">
                        {newProfileImage ? (
                          <img src={newProfileImage} alt="Preview" className="w-full h-full object-cover" />
                        ) : (
                          <span className="text-2xl">{newProfileEmoji}</span>
                        )}
                      </div>
                      <div className="flex-1">
                        <label className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-bold text-zinc-200 cursor-pointer transition-colors w-full justify-center">
                          <Camera className="w-4 h-4 text-yellow-400" />
                          Upload / Take Photo
                          <input 
                            type="file" 
                            accept="image/*" 
                            capture="environment" 
                            onChange={(e) => handleImageUpload(e, setNewProfileImage)} 
                            className="hidden" 
                          />
                        </label>
                      </div>
                    </div>

                    <div className="text-[11px] font-mono text-zinc-500 mb-2">Or select an emoji icon:</div>
                    <div className="flex gap-2 flex-wrap">
                      {['⚡', '🔥', '🛡️', '👑', '🚀', '🎯', '🐱', '⭐'].map(emoji => (
                        <button
                          type="button"
                          key={emoji}
                          onClick={() => {
                            setNewProfileEmoji(emoji);
                            setNewProfileImage(null);
                          }}
                          className={`w-10 h-10 rounded-xl text-lg flex items-center justify-center border transition-all cursor-pointer ${!newProfileImage && newProfileEmoji === emoji ? 'bg-yellow-400/20 border-yellow-400 text-white scale-105 shadow-md' : 'bg-zinc-950 border-zinc-800 text-zinc-400 hover:border-zinc-700'}`}
                        >
                          {emoji}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex items-center gap-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowNewProfileModal(false)}
                      className="w-1/2 py-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-mono font-bold uppercase tracking-wider transition-colors cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-3 rounded-xl bg-yellow-400 hover:bg-yellow-300 text-zinc-950 text-xs font-black uppercase tracking-wider shadow-lg cursor-pointer"
                    >
                      Register Pilot
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Edit Profile Modal */}
          {showEditProfileModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950/80 backdrop-blur-md">
              <div className="w-full max-w-md rounded-3xl bg-zinc-900 border border-zinc-800 p-6 shadow-2xl space-y-6">
                <div>
                  <h3 className="text-lg font-black text-white uppercase tracking-wider">Edit Pilot Profile</h3>
                  <p className="text-xs font-mono text-zinc-400 mt-1">Update your pilot name or profile picture.</p>
                </div>

                <form onSubmit={handleUpdateProfile} className="space-y-4">
                  <div>
                    <label className="block text-xs font-mono font-bold text-zinc-300 uppercase tracking-wider mb-2">Pilot Name</label>
                    <input
                      type="text"
                      value={editProfileName}
                      onChange={(e) => setEditProfileName(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-sm text-zinc-100 font-mono focus:outline-none focus:border-yellow-400"
                      required
                      autoFocus
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-mono font-bold text-zinc-300 uppercase tracking-wider mb-2">Profile Picture / Avatar</label>
                    <div className="flex items-center gap-3 mb-3">
                      <div className="w-14 h-14 rounded-xl bg-zinc-950 border border-zinc-800 flex items-center justify-center overflow-hidden shrink-0">
                        {editProfileImage ? (
                          <img src={editProfileImage} alt="Preview" className="w-full h-full object-cover" />
                        ) : (
                          <span className="text-2xl">{editProfileEmoji}</span>
                        )}
                      </div>
                      <div className="flex-1">
                        <label className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-bold text-zinc-200 cursor-pointer transition-colors w-full justify-center">
                          <Camera className="w-4 h-4 text-yellow-400" />
                          Change Photo
                          <input 
                            type="file" 
                            accept="image/*" 
                            capture="environment" 
                            onChange={(e) => handleImageUpload(e, setEditProfileImage)} 
                            className="hidden" 
                          />
                        </label>
                      </div>
                    </div>

                    <div className="text-[11px] font-mono text-zinc-500 mb-2">Or select an emoji icon:</div>
                    <div className="flex gap-2 flex-wrap">
                      {['⚡', '🔥', '🛡️', '👑', '🚀', '🎯', '🐱', '⭐'].map(emoji => (
                        <button
                          type="button"
                          key={emoji}
                          onClick={() => {
                            setEditProfileEmoji(emoji);
                            setEditProfileImage(null);
                          }}
                          className={`w-10 h-10 rounded-xl text-lg flex items-center justify-center border transition-all cursor-pointer ${!editProfileImage && editProfileEmoji === emoji ? 'bg-yellow-400/20 border-yellow-400 text-white scale-105 shadow-md' : 'bg-zinc-950 border-zinc-800 text-zinc-400 hover:border-zinc-700'}`}
                        >
                          {emoji}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex items-center gap-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowEditProfileModal(false)}
                      className="w-1/2 py-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-mono font-bold uppercase tracking-wider transition-colors cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-3 rounded-xl bg-yellow-400 hover:bg-yellow-300 text-zinc-950 text-xs font-black uppercase tracking-wider shadow-lg cursor-pointer"
                    >
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
</script>
